suite: backstage horizontal pod autoscaler
templates:
  - hpa.yaml
release:
  name: backstage
  namespace: backstage-system
tests:
  - it: does not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders when autoscaling is enabled
    values:
      - ../ci/autoscaling-values.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: apiVersion
          value: autoscaling/v2

  - it: renders replica limits and both configured metrics
    values:
      - ../ci/autoscaling-values.yaml
    asserts:
      - equal:
          path: spec.minReplicas
          value: 1
      - equal:
          path: spec.maxReplicas
          value: 3
      - equal:
          path: spec.metrics
          value:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 75
            - type: Resource
              resource:
                name: memory
                target:
                  type: Utilization
                  averageUtilization: 90

  - it: renders only the CPU metric when memory is unset
    set:
      backstage.autoscaling.enabled: true
    asserts:
      - equal:
          path: spec.metrics
          value:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 80

  - it: renders only the memory metric when CPU is unset
    set:
      backstage.autoscaling.enabled: true
      backstage.autoscaling.targetCPUUtilizationPercentage: null
      backstage.autoscaling.targetMemoryUtilizationPercentage: 85
    asserts:
      - equal:
          path: spec.metrics
          value:
            - type: Resource
              resource:
                name: memory
                target:
                  type: Utilization
                  averageUtilization: 85

  - it: targets the Backstage Deployment
    set:
      backstage.autoscaling.enabled: true
    asserts:
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: Deployment
            name: backstage
