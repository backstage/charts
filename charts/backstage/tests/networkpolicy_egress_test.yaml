suite: backstage egress network policy
templates:
  - networkpolicy-egress.yaml
release:
  name: backstage
  namespace: backstage-system
tests:
  - it: does not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render when egress restrictions are off
    set:
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders DNS and namespace egress when external connections are denied
    set:
      networkPolicy.enabled: true
      networkPolicy.egressRules.denyConnectionsToExternal: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: backstage-egress
      - equal:
          path: spec.policyTypes
          value:
            - Egress
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 53
                protocol: UDP
              - port: 53
                protocol: TCP
      - contains:
          path: spec.egress
          content:
            to:
              - namespaceSelector: {}

  - it: renders custom egress rules
    set:
      networkPolicy.enabled: true
      networkPolicy.egressRules.customRules:
        - to:
            - ipBlock:
                cidr: 10.0.0.0/8
          ports:
            - port: 443
              protocol: TCP
    asserts:
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.0.0.0/8
            ports:
              - port: 443
                protocol: TCP
