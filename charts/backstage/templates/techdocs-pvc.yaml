{{- if and .Values.techdocs.kubernetesRunner.enabled (not .Values.techdocs.kubernetesRunner.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "backstage.techdocs.claimName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: backstage
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  accessModes: {{- toYaml .Values.techdocs.kubernetesRunner.persistence.accessModes | nindent 4 }}
  {{- with .Values.techdocs.kubernetesRunner.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.techdocs.kubernetesRunner.persistence.size | quote }}
{{- end }}
